<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Abdullah & Doha</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HOME -->
    <section id="home">

        <img src="images/home.jpg" class="background">

        <button id="uploadBtn">
            Upload Your Memories
        </button>

        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <p id="progressText"></p>

        <input
            type="file"
            id="fileInput"
            accept="image/*,video/*"
            multiple
            hidden
        >

    </section>

    <!-- THANK YOU -->

    <section id="thankYou">

        <img src="images/thankyou.jpg" class="background">

    </section>

    <script type="module" src="script.js"></script>

</body>

</html>
